name: Publish release

# Runs when a signed APK is added to release/. The tag comes from versionName
# in AndroidManifest.xml, e.g. 1.3 -> v1.3. Existing releases are left alone.
on:
  push:
    branches: [main]
    paths: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release with the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"; exit 0
          fi
          gh release create "$TAG" "release/AutoBrightnessTile-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Auto Brightness Tile $TAG" \
            --notes-file "release/notes-$TAG.md"
