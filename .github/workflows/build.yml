name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aapt apksigner zipalign dalvik-exchange default-jdk-headless zip

      - name: Build (signed with a throwaway CI key)
        env:
          KS_PASS: ci-throwaway-key
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AutoBrightnessTile-apk
          path: build/AutoBrightnessTile-v*.apk
